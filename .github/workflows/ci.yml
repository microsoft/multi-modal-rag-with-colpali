name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for proper diff comparison

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks on changed files
        if: github.event_name == 'pull_request'
        run: pre-commit run --from-ref origin/${{ github.base_ref }} --to-ref HEAD

      - name: Run pre-commit hooks on all files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pre-commit run --all-files

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: agent
            command: python -m pytest tests -q
          - module: document_processor
            command: python -m unittest discover -s tests
          - module: colpali_inference
            command: python -m unittest discover -s tests
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --no-sync ${{ matrix.command }}

  deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Bicep without deploying
        run: |
          az bicep build --file modules/infra/src/main.bicep --stdout > /dev/null
          az bicep build-params --file modules/infra/src/main.bicepparam --stdout > /dev/null
      - name: Validate Helm chart
        run: |
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add reloader https://stakater.github.io/stakater-charts
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm dependency build modules/helm/colpali-stack
          helm lint modules/helm/colpali-stack
          helm template colpali-stack modules/helm/colpali-stack --set acrServer=example.azurecr.io > /dev/null
          helm template colpali-stack modules/helm/colpali-stack --set acrServer=example.azurecr.io --set ingress-nginx-colpali.enabled=true --set ingress-nginx-qdrant.enabled=true > /dev/null

  containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: agent
            dockerfile: Dockerfile
          - module: agent
            dockerfile: Dockerfile.chainlit
          - module: document_processor
            dockerfile: Dockerfile
          - module: colpali_inference
            dockerfile: Dockerfile
          - module: colpali_inference
            dockerfile: Dockerfile.vllm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image without pushing or downloading model weights
        run: docker build --file modules/${{ matrix.module }}/${{ matrix.dockerfile }} modules/${{ matrix.module }}
