{{- if and .Values.qdrant.enabled .Values.qdrantStorageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ required "qdrant.persistence.storageClassName is required when qdrantStorageClass.create is true" .Values.qdrant.persistence.storageClassName | quote }}
  labels:
    {{- include "colpali-stack.labels" . | nindent 4 }}
provisioner: disk.csi.azure.com
parameters:
  skuName: PremiumV2_LRS
  cachingMode: None
  fsType: ext4
  DiskIOPSReadWrite: {{ .Values.qdrantStorageClass.diskIOPSReadWrite | quote }}
  DiskMBpsReadWrite: {{ .Values.qdrantStorageClass.diskMBpsReadWrite | quote }}
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
{{- end }}
