[project]
name = "colpali-inference"
version = "0.1.0"
description = "Kubernetes-native ColPali inference service for document understanding and embedding generation"
authors = [
    {name = "Ben Constable", email = "benconstable@microsoft.com"},
    {name = "Nina Stijepovic", email = "nstijepovic@microsoft.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # FastAPI web framework
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.0.0",
    # CPU-only ML deps (model serving lives in the vLLM sidecar — the shim
    # only tokenizes and runs pooling math on CPU).
    "torch==2.13.0",
    "transformers>=5.17.0,<5.20.0",
    # colpali-engine is kept solely for HierarchicalTokenPooler. No model
    # loading from this package any more.
    "colpali-engine==0.3.18",
    "pillow>=13.0.0",
    "numpy==2.3.4",
    "huggingface-hub>=1.0.0,<2.0.0",
    # HTTP client and utilities
    "aiohttp>=3.14.4",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.31",
    # Environment management
    "python-dotenv>=1.0.0",
    # Azure Monitor OpenTelemetry for Application Insights
    "azure-monitor-opentelemetry>=1.8.11",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[tool.uv]
# Azure Monitor's OpenTelemetry instrumentation is published as beta releases.
prerelease = "allow"
# Security floors for transitive runtime and development dependencies.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "cryptography>=50.0.0",
    "fsspec>=2026.6.0",
    "msal>=1.39.0",
    "multidict>=6.9.1",
    "oauthlib>=4.0.0",
    "opentelemetry-api>=1.45.1",
    "pyjwt>=2.15.0",
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
    "virtualenv>=21.7.13",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pre-commit==4.2.0",
    "ruff==0.14.3",
]
