[project]
name = "agent"
version = "0.1.0"
description = "Azure OpenAI Agent for document Q&A using ColPali embeddings and GPT-5-mini"
authors = [
    {name = "Ben Constable", email = "benconstable@microsoft.com"},
    {name = "Nina Stijepovic", email = "nstijepovic@microsoft.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core==1.0.0b251120",
    "azure-identity>=1.25.1",
    "azure-storage-blob>=12.24.0",
    "aiohttp>=3.14.4",
    "chainlit>=2.12.0",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.2.2",
    "qdrant-client==1.16.2",
    "requests>=2.32.5",
    "sse-starlette>=2.0.0",
    "tenacity>=9.0.0",
    "uvicorn>=0.32.0",
    # Azure Monitor OpenTelemetry for Application Insights
    "azure-monitor-opentelemetry>=1.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.uv]
default-groups = ["dev"]
prerelease = "allow"
# Security floors for transitive dependencies; MSAL permits cryptography 50.
constraint-dependencies = [
    "azure-core>=1.38.0",
    "cryptography>=50.0.0",
    "filelock>=3.20.3",
    "h2>=4.4.1",
    "hpack>=4.2.0",
    "idna>=3.15",
    "marshmallow>=3.26.2",
    "msal>=1.39.0",
    "oauthlib>=4.0.0",
    "protobuf>=5.29.6",
    "python-engineio>=4.13.2",
    "python-socketio>=5.16.2",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
